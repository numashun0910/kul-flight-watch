<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東京⇄KL 航空券ウォッチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Mono:wght@400;700&display=swap">
<style>
/* デジタル庁デザインシステム準拠：キーカラー（青）1色＋ニュートラル＋セマンティック（成功・警告）。
   セクションは見出しと1pxの区切り線で分け、カードで囲わない。余白は 8 / 16 / 24 / 40 / 64px。 */
:root {
  --page: #f3f5f7;
  --bg: #ffffff;
  --surface-subtle: #f2f2f2;
  --ink: #1a1a1c;
  --ink-2: #4d4d4d;
  --ink-3: #666666;
  --line: #d6d6d6;
  --line-strong: #949494;
  --key: #0031d8;
  --key-strong: #00118f;
  --key-soft: #e8f1fe;
  --on-key: #ffffff;
  --success: #197a4b; --success-bg: #e6f5ec;
  --warning: #8a5a00; --warning-bg: #fff4d6;
  --error: #ce0000;
  --seq-0: #d9e6ff; --seq-1: #9db7f9; --seq-2: #7096f8; --seq-3: #3460fb; --seq-4: #0031d8; --seq-5: #000082;
  --seq-ink: #ffffff;
  --font: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --mono: "Noto Sans Mono", ui-monospace, "SFMono-Regular", monospace;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 40px; --s5: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #111113; --bg: #1c1c20; --surface-subtle: #26262b; --ink: #f2f2f2; --ink-2: #c7c7c7; --ink-3: #a3a3a3;
    --line: #3a3a3e; --line-strong: #6e6e73; --key: #7096f8; --key-strong: #9db7f9; --key-soft: #14224a; --on-key: #111113;
    --success: #6fd39c; --success-bg: #12301f; --warning: #f5c35a; --warning-bg: #33280c; --error: #ff7a7a;
    --seq-0: #1a2a52; --seq-1: #23408f; --seq-2: #2f5bd0; --seq-3: #4979f5; --seq-4: #7c9ff7; --seq-5: #b7cbfb;
    --seq-ink: #111113;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #111113; --bg: #1c1c20; --surface-subtle: #26262b; --ink: #f2f2f2; --ink-2: #c7c7c7; --ink-3: #a3a3a3;
  --line: #3a3a3e; --line-strong: #6e6e73; --key: #7096f8; --key-strong: #9db7f9; --key-soft: #14224a; --on-key: #111113;
  --success: #6fd39c; --success-bg: #12301f; --warning: #f5c35a; --warning-bg: #33280c; --error: #ff7a7a;
  --seq-0: #1a2a52; --seq-1: #23408f; --seq-2: #2f5bd0; --seq-3: #4979f5; --seq-4: #7c9ff7; --seq-5: #b7cbfb;
  --seq-ink: #111113;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.75; letter-spacing: .02em;
  padding-inline: 16px;
  padding-block: max(var(--s3), env(safe-area-inset-top)) max(var(--s5), env(safe-area-inset-bottom));
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: var(--s3); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); letter-spacing: 0; }
h1, h2 { margin: 0; line-height: 1.4; text-wrap: balance; font-weight: 700; }
h1 { font-size: 28px; letter-spacing: .01em; }
h2 { font-size: 20px; }
p { margin: 0; }
.desc { color: var(--ink-2); }
a { color: var(--key); text-decoration: underline; text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--key); outline-offset: 2px; border-radius: 4px; }
svg.icon { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* page header */
.page-head { display: grid; gap: var(--s1); }
.page-head .updated { color: var(--ink-2); }

/* sections: 薄い面の上に、1px 枠・角丸 12px の白い面を置く。はみ出す図表は面の中で横スクロール */
.section { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: var(--s3); display: grid; gap: var(--s3); min-width: 0; align-content: start; }
.section-head { display: grid; gap: var(--s1); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }

/* summary */
.summary { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s4); align-items: start; }
.status { display: flex; gap: var(--s2); padding: var(--s2); border: 1px solid currentColor; border-radius: 8px; }
.status.buy { color: var(--success); background: var(--success-bg); }
.status.lean { color: var(--warning); background: var(--warning-bg); }
.status.wait { color: var(--key); background: var(--key-soft); }
.status-body { display: grid; gap: 4px; }
.status-label { font-weight: 700; font-size: 20px; line-height: 1.4; }
.status-note { color: var(--ink); }
.price-block { display: grid; gap: var(--s1); margin-top: var(--s3); }
.price-label { color: var(--ink-2); }
.price { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: 0; }
.delta { font-weight: 700; }
.delta.up { color: var(--error); } .delta.down { color: var(--success); } .delta.flat { color: var(--ink-2); font-weight: 400; }

dl.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; border-top: 1px solid var(--line); }
dl.facts dt, dl.facts dd { margin: 0; padding: 12px 0; border-bottom: 1px solid var(--line); line-height: 1.5; }
dl.facts dt { color: var(--ink-2); padding-right: var(--s3); white-space: nowrap; }
dl.facts dd { font-weight: 700; min-width: 0; }
.btn { display: inline-flex; justify-content: center; align-items: center; min-height: 48px; padding: 0 var(--s3); background: var(--key); color: var(--on-key); font-weight: 700; border-radius: 8px; text-decoration: underline; text-underline-offset: 3px; margin-top: var(--s3); }
.btn:hover { background: var(--key-strong); }
.btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s3); margin-top: var(--s3); }
.btn-row .btn { margin-top: 0; }
.heat td a { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: inherit; text-decoration: none; }
.heat td a:hover { text-decoration: underline; }
tr[data-href] { cursor: pointer; }
tr[data-href]:hover td { background: var(--key-soft); }
.go { white-space: nowrap; }
.click-note { color: var(--ink-2); font-size: 14px; }

/* range bar */
.range { position: relative; height: 104px; margin: 0 var(--s4); min-width: 400px; }
.range-track { position: absolute; left: 0; right: 0; top: 48px; height: 8px; background: var(--surface-subtle); border: 1px solid var(--line); }
.range-band { position: absolute; top: 48px; height: 8px; background: var(--seq-1); }
.range-band-label { position: absolute; top: 60px; font-size: 14px; color: var(--ink-2); transform: translateX(-50%); white-space: nowrap; }
.mark { position: absolute; top: 0; transform: translateX(-50%); display: grid; justify-items: center; }
.mark .tag { font-size: 14px; font-weight: 700; white-space: nowrap; padding: 4px var(--s1); border-radius: 4px; line-height: 1.3; }
.mark .tick { width: 0; height: 22px; margin-top: 2px; }
.mark.now .tag { background: var(--ink); color: var(--bg); }
.mark.now .tick { width: 2px; background: var(--ink); }
.mark.target .tag { background: var(--bg); color: var(--ink); border: 1px solid var(--ink); }
.mark.target .tick { border-right: 2px dashed var(--ink); }
.scale { position: absolute; top: 84px; font-size: 14px; color: var(--ink-3); transform: translateX(-50%); }

/* charts */
.chart-box { position: relative; height: 260px; min-width: 440px; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); color: var(--ink-2); font-size: 14px; }
.legend span { display: inline-flex; align-items: center; gap: var(--s1); }
.sw { width: 20px; height: 0; border-top: 2px solid var(--key); display: inline-block; }
.sw.dash { border-top: 2px dashed var(--ink-2); }

/* heatmap */
.scroll-x { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
.scroll-hint { display: none; color: var(--ink-3); font-size: 14px; }
.heat { border-collapse: separate; border-spacing: 2px; font-size: 14px; line-height: 1.3; }
.heat th { font-weight: 400; color: var(--ink-2); padding: 2px 4px; white-space: nowrap; text-align: center; }
.heat th.row { text-align: right; padding-right: var(--s1); position: sticky; left: 0; background: var(--bg); }
.heat td { width: 40px; min-width: 40px; height: 40px; text-align: center; font-weight: 700; font-size: 14px; }
.heat td.best { outline: 3px solid var(--ink); outline-offset: -3px; }
.heat .sat { color: var(--key); } .heat .sun { color: var(--error); }
.heat-legend { display: flex; align-items: center; gap: var(--s1) var(--s2); color: var(--ink-2); font-size: 14px; flex-wrap: wrap; }
.heat-legend .ramp { display: flex; gap: 2px; }
.heat-legend .ramp i { width: 24px; height: 16px; display: block; }
.heat-legend .bestkey { display: inline-flex; align-items: center; gap: var(--s1); }
.heat-legend .bestkey i { width: 16px; height: 16px; border: 3px solid var(--ink); display: block; }

/* month comparison */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; width: fit-content; }
.seg button { font: inherit; border: 0; background: var(--bg); color: var(--ink); min-height: 44px; padding: 0 var(--s2); cursor: pointer; }
.seg button + button { box-shadow: inset 1px 0 0 var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--key); color: var(--on-key); font-weight: 700; }
table.list { width: 100%; border-collapse: collapse; }
table.list th { text-align: left; font-weight: 700; padding: 12px var(--s2) 12px 0; border-bottom: 1px solid var(--line-strong); white-space: nowrap; line-height: 1.5; }
table.list td { padding: 12px var(--s2) 12px 0; border-bottom: 1px solid var(--line); white-space: nowrap; line-height: 1.5; vertical-align: middle; }
table.list .r { text-align: right; }
#mtable { min-width: 420px; }
table.list td.bar { width: 40%; min-width: 120px; padding-right: 0; }
.bar i { display: block; height: 16px; background: var(--seq-1); }
.bar i.here { background: var(--key); }

/* reasons */
.reasons { margin: 0; padding-left: 1.25em; display: grid; gap: var(--s1); }

.foot { padding-top: var(--s3); color: var(--ink-2); font-size: 14px; display: grid; gap: var(--s1); }
.error { padding-block: var(--s4); display: grid; gap: var(--s1); }

#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--ink); color: var(--bg); font-size: 14px; line-height: 1.5; padding: var(--s1) 12px; border-radius: 4px; white-space: nowrap; opacity: 0; }

@media (max-width: 760px) {
  h1 { font-size: 24px; }
  .summary, .cols { grid-template-columns: minmax(0, 1fr); }
  .price { font-size: 48px; }
  .range { margin: 0 var(--s3); }
  .section { padding: var(--s2); }
  .scroll-hint { display: block; }
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="page-head">
    <h1>東京⇄クアラルンプール 航空券ウォッチ</h1>
    <p class="updated">読み込み中</p>
  </header>
</div>
<div id="tip" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function () {
  const app = document.getElementById("app");
  const tip = document.getElementById("tip");
  const yen = v => v == null ? "—" : "¥" + Math.round(v).toLocaleString("ja-JP");
  const DOW = "日月火水木金土";
  const pd = s => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const md = s => { const d = pd(s); return (d.getMonth() + 1) + "/" + d.getDate() + "(" + DOW[d.getDay()] + ")"; };
  const mdShort = s => { const d = pd(s); return (d.getMonth() + 1) + "/" + d.getDate(); };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const hm = m => m == null ? "—" : Math.floor(m / 60) + "時間" + (m % 60 ? (m % 60) + "分" : "");
  const AIRPORT = { NRT: "成田", HND: "羽田", KUL: "クアラルンプール" };

  const ICON = {
    buy: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.75 2.75L16 10"/></svg>',
    lean: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l9 16H3z"/><path d="M12 10v4.5M12 17.2v.1"/></svg>',
    wait: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/></svg>'
  };
  const NOTE = {
    buy: "目標価格に届いたか、待つより今買うほうが安く済みそうです。Google フライトで便を確認してから購入してください。",
    lean: "そこそこの値段です。目標価格に近づいたら買いましょう。",
    wait: "今はまだ高めです。目標価格まで下がるのを待つのがおすすめです。下がったら判定は自動で「今買う」に変わります。"
  };

  function showTip(e, html) {
    tip.innerHTML = html; tip.style.opacity = 1;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 12, y = e.clientY - h - 10;
    if (x + w > innerWidth - 8) x = e.clientX - w - 12;
    if (y < 8) y = e.clientY + 16;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  const hideTip = () => { tip.style.opacity = 0; };

  fetch("data.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(err => {
      app.innerHTML = '<div class="error"><h2>データを読み込めませんでした</h2><p class="desc">少し待ってからページを再読み込みしてください。（' + esc(err.message) + '）</p></div>';
    });

  let charts = [];
  function render(D) {
    const checks = D.checks || [];
    const prev = checks.length >= 2 ? checks[checks.length - 2] : null;
    const diff = prev ? D.price - prev.best_price : null;
    const diffPct = prev ? diff / prev.best_price * 100 : null;
    const deltaHtml = prev == null ? '<span class="delta flat">前回のデータはまだありません</span>'
      : diff === 0 ? '<span class="delta flat">前回（' + esc(prev.fetched_at.slice(5)) + '）と同じ</span>'
      : '<span class="delta ' + (diff > 0 ? "up" : "down") + '">前回より ' + yen(Math.abs(diff)) + (diff > 0 ? " 値上がり" : " 値下がり") + "（" + (diff > 0 ? "+" : "−") + Math.abs(diffPct).toFixed(1) + "%）</span>";
    const tone = D.tone || "wait";
    const verdictShort = D.verdict.replace(/（.*）/, "");
    const b = D.best;
    const place = cs => cs.map(c => (AIRPORT[c] || c) + "（" + c + "）").join("・");
    const toTarget = D.price - D.target;
    let monthDur = (D.months[0] || {}).duration;

    app.innerHTML = `
      <header class="page-head">
        <h1>東京⇄クアラルンプール 航空券ウォッチ</h1>
        <p class="updated">最終チェック <span class="num">${esc(D.fetched_at)}</span>。ページを再読み込みすると最新の結果になります。</p>
      </header>

      <section class="section" aria-labelledby="h-now">
        <h2 id="h-now" hidden>今の判定</h2>
        <div class="summary">
          <div>
            <div class="status ${tone}" role="status">${ICON[tone]}
              <div class="status-body"><span class="status-label">判定：${esc(verdictShort)}</span><span class="status-note">${NOTE[tone]}</span></div>
            </div>
            <div class="price-block">
              <span class="price-label">今いちばん安い往復（大人1名・エコノミー）</span>
              <span class="price num">${yen(D.price)}</span>
              ${deltaHtml}
            </div>
          </div>
          <div>
            <dl class="facts">
              <dt>目標価格</dt><dd class="num">${yen(D.target)} 以下なら買い</dd>
              <dt>行き</dt><dd>${md(b.out)} ${esc(place(D.route.origin))} 発</dd>
              <dt>帰り</dt><dd>${md(b.ret)} ${esc(place(D.route.destination))} 発</dd>
              <dt>航空会社</dt><dd>${esc(b.airline)}</dd>
              <dt>経路</dt><dd>${esc(b.route || "—")}</dd>
              <dt>出発まで</dt><dd class="num">${D.days_left} 日</dd>
            </dl>
            <div class="btn-row">
              <a class="btn" href="${esc(D.flight_link || D.link)}" target="_blank" rel="noopener">この便を Google フライトで見る</a>
              <a href="${esc(D.link)}" target="_blank" rel="noopener">同じ日付のほかの便を見る</a>
            </div>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="h-range">
        <div class="section-head">
          <h2 id="h-range">今の値段は高いか、安いか</h2>
          <p class="desc">青い帯は、この時期のこの路線の「ふつうの値段」の範囲です（Google フライト調べ）。</p>
        </div>
        <div class="scroll-x"><div class="range" id="range"></div></div>
        <p>${toTarget > 0
          ? `目標価格まで、あと <b class="num">${yen(toTarget)}</b> 下がれば買い時です。下がるとしたら <span class="num">${yen(D.pred_low)}</span> 前後、うまくいけば <span class="num">${yen(D.pred_lucky)}</span> まで下がる見込みです。`
          : `目標価格を <b class="num">${yen(-toTarget)}</b> 下回っています。買い時です。`}</p>
      </section>

      <div class="cols">
        <section class="section" aria-labelledby="h-g">
          <div class="section-head">
            <h2 id="h-g">この日程の値段の動き（直近60日）</h2>
            <p class="desc">${md(b.out)}→${md(b.ret)} の最安値の推移。${D.trend.chg7 != null ? "この1週間で " + (D.trend.chg7 > 0 ? "+" : "") + D.trend.chg7.toFixed(0) + "%。" : ""}</p>
          </div>
          <div class="legend"><span><i class="sw"></i>その日の最安値</span><span><i class="sw dash"></i>目標価格 ${yen(D.target)}</span></div>
          <p class="click-note">グラフをクリックすると、この日程の最安便を選んだ状態で Google フライトが開きます。</p>
          <p class="scroll-hint">横にスクロールすると続きが見られます</p>
          <div class="scroll-x"><div class="chart-box"><canvas id="c-google" role="img" aria-label="直近60日の値段の推移。最安 ${yen(D.trend.g_min)}、最高 ${yen(D.trend.g_max)}"></canvas></div></div>
        </section>
        <section class="section" aria-labelledby="h-c">
          <div class="section-head">
            <h2 id="h-c">チェックごとの最安値</h2>
            <p class="desc">このツールがチェックした回ごとの、期間内でいちばん安い値段。現在 ${checks.length} 回分です。</p>
          </div>
          <div class="legend"><span><i class="sw"></i>最安値</span><span><i class="sw dash"></i>その回の目標価格</span></div>
          <p class="click-note">点をクリックすると、その回の最安日程の Google フライトが開きます。</p>
          <p class="scroll-hint">横にスクロールすると続きが見られます</p>
          <div class="scroll-x"><div class="chart-box"><canvas id="c-checks" role="img" aria-label="チェックごとの最安値の推移"></canvas></div></div>
        </section>
      </div>

      <section class="section" aria-labelledby="h-heat">
        <div class="section-head">
          <h2 id="h-heat">日付ごとの値段</h2>
          <p class="desc">横が行きの日、縦が旅の長さです。数字は千円単位（79 は約7.9万円）で、色が濃いほど高くなります。マスにカーソルを合わせると正確な値段が出て、クリックするとその日程の Google フライトが開きます。</p>
        </div>
        <div class="heat-legend">
          <span>安い</span><span class="ramp">${[0,1,2,3,4,5].map(i => `<i style="background:var(--seq-${i})"></i>`).join("")}</span><span>高い</span>
          <span class="bestkey"><i></i>今の最安の日程</span>
        </div>
        <div class="scroll-x"><table class="heat" id="heat"></table></div>
      </section>

      <div class="cols">
        <section class="section" aria-labelledby="h-m">
          <div class="section-head">
            <h2 id="h-m">ほかの時期との比較</h2>
            <p class="desc">各時期でいちばん安い往復の値段です。</p>
          </div>
          <div class="seg" role="group" aria-label="旅の長さ" id="seg">${D.months.map(m => `<button type="button" id="seg-${m.duration}" data-d="${m.duration}" aria-pressed="${m.duration === monthDur}">${m.duration}泊${m.duration + 1}日</button>`).join("")}</div>
          <div class="scroll-x"><table class="list" id="mtable"></table></div>
        </section>
        <section class="section" aria-labelledby="h-r">
          <div class="section-head">
            <h2 id="h-r">判定の理由</h2>
            <p class="desc">判定スコア <span class="num">${D.score > 0 ? "+" : ""}${D.score.toFixed(1)}</span>。プラスが大きいほど「今買う」寄りです。</p>
          </div>
          <ul class="reasons">${D.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        </section>
      </div>

      <section class="section" aria-labelledby="h-f">
        <div class="section-head">
          <h2 id="h-f">${md(b.out)}→${md(b.ret)} の便</h2>
          <p class="desc">安い順です。LCC（ベトジェット、スクート、エアアジアなど）は預け荷物や座席指定が別料金のことが多いので注意してください。</p>
        </div>
        <div class="scroll-x"><table class="list">
          <thead><tr><th>航空会社</th><th>経路</th><th>便名</th><th>乗継</th><th class="r">所要時間</th><th class="r">往復の値段</th><th><span hidden>リンク</span></th></tr></thead>
          <tbody>${D.flights.map(f => `<tr data-href="${esc(f.link || D.link)}"><td><a href="${esc(f.link || D.link)}" target="_blank" rel="noopener">${esc(f.airline)}</a></td><td>${esc(f.route)}</td><td class="mono">${esc(f.flights)}</td><td>${f.stops === 0 ? "直行" : f.stops + "回"}</td><td class="r num">${hm(f.minutes)}</td><td class="r num">${yen(f.price)}</td><td><a class="go" href="${esc(f.link || D.link)}" target="_blank" rel="noopener">この便を見る</a></td></tr>`).join("")}</tbody>
        </table></div>
      </section>

      <section class="section" aria-labelledby="h-h">
        <div class="section-head"><h2 id="h-h">チェック履歴</h2><p class="desc">新しい順です。</p></div>
        <div class="scroll-x"><table class="list">
          <thead><tr><th>チェック日時</th><th>最安の日程</th><th>航空会社</th><th class="r">最安値</th><th class="r">前回比</th><th class="r">目標価格</th><th>判定</th></tr></thead>
          <tbody>${checks.map((h, i) => {
            const p = i > 0 ? checks[i - 1] : null;
            const d = p ? h.best_price - p.best_price : null;
            const dc = d == null ? "—" : d === 0 ? "±0" : `<span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${yen(Math.abs(d)).slice(1)}</span>`;
            return `<tr data-href="${esc(h.link || "")}"><td class="num">${esc(h.fetched_at)}</td><td>${h.link ? `<a href="${esc(h.link)}" target="_blank" rel="noopener">${md(h.best_out)}→${md(h.best_ret)}</a>` : md(h.best_out) + "→" + md(h.best_ret)}</td><td>${esc(h.airline)}</td><td class="r num">${yen(h.best_price)}</td><td class="r num">${dc}</td><td class="r num">${yen(h.target)}</td><td>${esc(String(h.verdict).replace(/（.*）/, ""))}</td></tr>`;
          }).reverse().join("")}</tbody>
        </table></div>
      </section>

      <footer class="foot">
        <p>表の行、カレンダーのマス、グラフの点をクリックすると、その航空券の Google フライトが開きます。便がわかっているところ（便の一覧など）は、往路の便を選んだ状態で開きます。</p>
        <p>条件：${esc(D.window[0].slice(5).replace("-", "/"))}〜${esc(D.window[1].slice(5).replace("-", "/"))} の間で ${esc(D.trip[0])}〜${esc(D.trip[1])}、大人1名・エコノミー・乗継あり。値段は Google フライト上の最安販売サイトの値段です。</p>
        <p>「下がるとしたら」は過去の値動きから出した目安で、保証ではありません。購入は Google フライトから各自で行ってください。</p>
      </footer>`;

    renderRange(D);
    renderHeat(D);
    const seg = document.getElementById("seg");
    seg.addEventListener("click", e => {
      const btn = e.target.closest("button"); if (!btn) return;
      monthDur = Number(btn.dataset.d);
      seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === btn)));
      renderMonths(D, monthDur);
    });
    renderMonths(D, monthDur);
    app.addEventListener("click", e => {
      if (e.target.closest("a, button")) return;
      const tr = e.target.closest("tr[data-href]");
      if (tr && tr.dataset.href) window.open(tr.dataset.href, "_blank", "noopener");
    });
    drawCharts(D);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => drawCharts(D));
  }

  function renderRange(D) {
    const el = document.getElementById("range");
    const t = D.typical || {};
    const vals = [D.price, D.target, D.pred_lucky, t.low, t.high].filter(v => v != null);
    const lo = Math.floor(Math.min(...vals) * 0.92 / 10000) * 10000;
    const hi = Math.ceil(Math.max(...vals) * 1.05 / 10000) * 10000;
    const x = v => ((v - lo) / (hi - lo) * 100).toFixed(2) + "%";
    let html = '<div class="range-track"></div>';
    if (t.low != null) {
      html += `<div class="range-band" style="left:${x(t.low)};width:calc(${x(t.high)} - ${x(t.low)})"></div>`;
      html += `<div class="range-band-label num" style="left:${x((t.low + t.high) / 2)}">ふつうの値段 ${yen(t.low)}〜${yen(t.high)}</div>`;
    }
    for (let v = lo + 10000; v < hi; v += 10000) {
      if ((v / 10000) % 2 === 0) html += `<div class="scale num" style="left:${x(v)}">${v / 10000}万</div>`;
    }
    const near = Math.abs(D.price - D.target) / (hi - lo) < 0.14;
    html += `<div class="mark target" style="left:${x(D.target)}"><span class="tag num">目標 ${yen(D.target)}</span><span class="tick"></span></div>`;
    html += `<div class="mark now" style="left:${x(D.price)}${near ? ";top:-32px" : ""}"><span class="tag num">今 ${yen(D.price)}</span><span class="tick"${near ? ' style="height:54px"' : ""}></span></div>`;
    el.innerHTML = html;
    if (near) el.style.marginTop = "32px";
  }

  function renderHeat(D) {
    const el = document.getElementById("heat");
    const all = D.calendar.flatMap(r => r.cells.map(c => c.price)).filter(v => v != null);
    const mn = Math.min(...all), mx = Math.max(...all);
    const step = v => Math.min(5, Math.floor((v - mn) / (mx - mn + 1) * 6));
    const cols = D.calendar[0].cells.map(c => c.out);
    let html = "<thead><tr><th></th>" + cols.map(o => {
      const d = pd(o); const w = d.getDay();
      return `<th class="${w === 6 ? "sat" : w === 0 ? "sun" : ""}"><span class="num">${d.getMonth() + 1}/${d.getDate()}</span><br>${DOW[w]}</th>`;
    }).join("") + "</tr></thead><tbody>";
    D.calendar.forEach(row => {
      const byOut = Object.fromEntries(row.cells.map(c => [c.out, c]));
      html += `<tr><th class="row" scope="row">${esc(row.label)}</th>` + cols.map(o => {
        const c = byOut[o];
        if (!c || c.price == null) return '<td style="background:var(--surface-subtle)" aria-label="データなし"></td>';
        const s = step(c.price);
        const best = c.out === D.best.out && c.ret === D.best.ret;
        const ink = s >= 3 ? "var(--seq-ink)" : "var(--ink)";
        const label = md(c.out) + "→" + md(c.ret) + " " + yen(c.price) + (best ? "（今の最安）" : "");
        return `<td class="num${best ? " best" : ""}" style="background:var(--seq-${s});color:${ink}" data-tip="${esc(md(c.out) + " → " + md(c.ret) + "<br><b>" + yen(c.price) + "</b>" + (best ? "（今の最安）" : "") + "<br>クリックで Google フライトを開く")}"><a href="${esc(c.link || D.link)}" target="_blank" rel="noopener" aria-label="${esc(label)}（Google フライトで見る）">${Math.round(c.price / 1000)}</a></td>`;
      }).join("") + "</tr>";
    });
    el.innerHTML = html + "</tbody>";
    el.addEventListener("mousemove", e => { const td = e.target.closest("td[data-tip]"); td ? showTip(e, td.dataset.tip) : hideTip(); });
    el.addEventListener("mouseleave", hideTip);
  }

  function renderMonths(D, dur) {
    const m = D.months.find(x => x.duration === dur) || D.months[0];
    const el = document.getElementById("mtable");
    if (!m) { el.innerHTML = "<tr><td>データなし</td></tr>"; return; }
    const mx = Math.max(...m.rows.map(r => r.min));
    el.innerHTML = "<thead><tr><th>時期</th><th class=\"r\">最安値</th><th class=\"r\">中央値</th><th><span hidden>グラフ</span></th></tr></thead><tbody>" +
      m.rows.map(r => {
        const here = r.month === "希望期間";
        const name = here ? "<b>今回の期間</b>" : esc(r.month);
        const when = r.out ? `<br><a href="${esc(r.link)}" target="_blank" rel="noopener" class="num">${md(r.out)}→${md(r.ret)}</a>` : "";
        return `<tr${r.link ? ` data-href="${esc(r.link)}"` : ""}><td>${name}${when}</td><td class="r num">${here ? "<b>" + yen(r.min) + "</b>" : yen(r.min)}</td><td class="r num">${yen(r.median)}</td><td class="bar" aria-hidden="true"><i class="${here ? "here" : ""}" style="width:${(r.min / mx * 100).toFixed(1)}%"></i></td></tr>`;
      }).join("") + "</tbody>";
  }

  function drawCharts(D) {
    if (!window.Chart) return;
    charts.forEach(c => c.destroy()); charts = [];
    const ink = css("--ink"), ink2 = css("--ink-2"), line = css("--line"), key = css("--key"), bg = css("--bg");
    Chart.defaults.font.family = css("--font");
    Chart.defaults.font.size = 14;
    Chart.defaults.color = ink2;
    const base = {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: ink, titleColor: bg, bodyColor: bg, displayColors: false, padding: 12, cornerRadius: 4,
          titleFont: { size: 14 }, bodyFont: { size: 14 },
          callbacks: { label: c => c.dataset.label + " " + yen(c.parsed.y) }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 16 }, border: { color: line } },
        y: { grid: { color: line }, border: { display: false }, ticks: { callback: v => (v / 10000).toFixed(1) + "万" } }
      }
    };
    const gh = D.google_history || [];
    if (gh.length) {
      charts.push(new Chart(document.getElementById("c-google"), {
        type: "line",
        data: {
          labels: gh.map(p => mdShort(p[0])),
          datasets: [
            { label: "最安値", data: gh.map(p => p[1]), borderColor: key, borderWidth: 2, pointRadius: gh.map((_, i) => i === gh.length - 1 ? 5 : 0), pointBackgroundColor: key, pointBorderColor: bg, pointBorderWidth: 2, tension: 0 },
            { label: "目標価格", data: gh.map(() => D.target), borderColor: ink2, borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0 }
          ]
        },
        options: { ...base, onClick: (e, els) => { if (els.length) window.open(D.flight_link || D.link, "_blank", "noopener"); } }
      }));
    }
    const ck = D.checks || [];
    charts.push(new Chart(document.getElementById("c-checks"), {
      type: "line",
      data: {
        labels: ck.map(h => { const d = pd(h.fetched_at); return (d.getMonth() + 1) + "/" + d.getDate() + " " + h.fetched_at.slice(11, 16); }),
        datasets: [
          { label: "最安値", data: ck.map(h => h.best_price), borderColor: key, backgroundColor: key, borderWidth: 2, pointRadius: 5, pointHoverRadius: 7, pointBorderColor: bg, pointBorderWidth: 2, tension: 0 },
          { label: "目標価格", data: ck.map(h => h.target), borderColor: ink2, borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0, stepped: true }
        ]
      },
      options: { ...base, onClick: (e, els) => { const h = els.length && ck[els[0].index]; if (h && h.link) window.open(h.link, "_blank", "noopener"); }, scales: { ...base.scales, y: { ...base.scales.y, suggestedMin: Math.min(...ck.map(h => h.target)) * 0.9 } } }
    }));
  }
})();
</script>
</body>
</html>
